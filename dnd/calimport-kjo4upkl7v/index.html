<script type="application/json" id="data">{"tagline": "A crew of airship smugglers takes questionable jobs out of Calimport, a city where one archmage has made death optional, and keeps ending up holding the biggest questions in the realm.", "overview": ["The story takes place on Toril, in Faerûn, in the desert land of Calimshan. Calimport is its largest port city. It used to be loud, dirty, and dangerous. Now it is cleaner and brighter. The sewers work, magical streetlights glow, food is cheaper, and disease is rare.", "Most of that change comes from one organization, the Centre for Applied Research (CFAR). Its founder, the archmage Charles Xander, now holds the title of Pasha. CFAR's most controversial work is a web of magical wire through the whole city. When someone dies, the network notices, and CFAR's Emergency Miracle Technicians (EMTs) arrive within minutes to bring them back. In Calimport, death is no longer permanent. Most of the time.", "Not everyone likes this. The Church of Kelemvor, god of the dead, says something essential is being broken, soul by soul. The Zhentarim, a network of thieves and assassins, have lost money and leverage, because the people they kill keep coming back.", "The players are a crew aboard an airship that calls Calimport home. They run cargo, people, and jobs that polite society does not want to touch. They are not saints, but they fly together by choice, and they do not sell each other out. They have a code, even if it is an imperfect one. The tone is loosely inspired by Firefly."], "party": [{"name": "Arjun", "summary": "Human, the ship's captain. An escaped prisoner from the Sapra mine-prison with a bounty on his head. He is faithless (he serves no god), and he hunts Magnus, the wizard with color-changing eyes who took his friend Oren.", "status": "active"}, {"name": "Anakis", "summary": "The ship's engineer, from Baldur's Gate, where she funds an orphanage run by Maribel. She repairs and builds the crew's shielded chests, carries a pet mouse named Temme, and says the thing nobody else wants to say.", "status": "active"}, {"name": "Korvara Starglade", "summary": "Wood elf druid and the ship's navigator, who reads the stars better than any map. She has old ties to the Harpers and carries a Harper token, but has not joined them.", "status": "active"}, {"name": "Quix", "summary": "Tinkerer and gunslinger from Crimmor (pronounced \"Kee\"). He carries the loss of his old friend Olivea, and took a job from the fixer Mr. Quell to get a resurrection scroll to bring her back.", "status": "unknown"}, {"name": "Freya", "summary": "Wood elf ranger (Fey Wanderer) who joined in Faeressar. She told the crew that the Broker paid her to join them and report back. She learned that her mother, Sylwen, is alive and imprisoned, and she carries her mother's sword, Snicker-Snack.", "status": "active"}, {"name": "Dendrobo", "summary": "Grung (a three-foot purple poison dart frog) and cleric of Umberlee, with the best armor on the crew. He left the job in Faeressar, then turned up again in a Calimport fish-seller's cage.", "status": "active"}, {"name": "Corvo", "summary": "Bard and lute player who was hired by the Church of Kelemvor to play for the dying at the Lastlight hospice. He joined the crew there and sent Sed Halloran off a wall with an illusion.", "status": "unknown"}, {"name": "Counselor Beans", "summary": "Human ranger with the manner of a summer-camp counselor, who calls everyone \"campers\" and prefers words over swords. He likes to lick cursed objects, and the Staff of Shoon aged him to 75. He now goes by Grandpa Beans and leads an army of pixies who call him General.", "status": "active"}, {"name": "Celeste", "summary": "Warforged wizard whose magic bends time, and who keeps slipping through time herself. She carries the Staff of Shoon, and she alone can see the spirit inside it.", "status": "active"}, {"name": "The artificer (name to come)", "summary": "A mace-carrying tinkerer who joined the crew between sessions 10 and 12. He casts Detect Magic as a ritual from his toolkit and has very quick hands.", "status": "active"}, {"name": "The halfling (name to come)", "summary": "Halfling in a white pompadour wig who served tea in Tasha's cave and is also a spy for the Seelie Court. Tasha sent him with the party to make sure they keep their deal.", "status": "active"}], "npcs": [{"name": "Charles Xander", "role": "Archmage, Pasha of Calimport, founder of CFAR", "notes": "He hired the crew to carry a Mythallar, then admitted he used them as bait for Magnus. He is faithless and thinks the gods are tyrants. He was badly hurt by Magnus and later authorized the crew's staged heist.", "group": "patron"}, {"name": "Emi Sandoval", "role": "CFAR logistics handler", "notes": "Korvara won her over in Faeressar, and the crew kept her alive through the handoff. She is now their contact inside CFAR. She insists she is not the criminal mastermind.", "group": "ally"}, {"name": "Meepo", "role": "Kobold at K-Mart (Kobold Mart)", "notes": "The crew saved him from a beating in Session 1. He wrote the letter of recommendation that got them their first big job, and later asked them to find little Pook.", "group": "ally"}, {"name": "Father Tomás Greymoor", "role": "Kelemvorite priest at the Lastlight hospice", "notes": "Kind, tired, and strongly against CFAR. He paid the crew to break the toll racket and rescue the children. He is far more powerful than he looks: he killed a captive with one spell and wants the Shoon wall sealed.", "group": "patron"}, {"name": "Lira", "role": "Harper agent with a bookshop safe house", "notes": "She gave Korvara a Harper token and decoded the cipher book that pointed at Dagoth. She arrested Dagoth on that evidence. She thinks Korvara will join the Harpers eventually.", "group": "neutral"}, {"name": "Magnus", "role": "Immortal wizard, Arjun's enemy", "notes": "A murderer who took Charles's experimental-resurrection deal as Subject Zero and came back from beyond the Wall of the Faithless with terrible power. He survived a bullet to the head, wounded Charles, and holds Arjun's friend Oren somewhere in the Fugue Plane.", "group": "rival"}, {"name": "Merrick", "role": "Guard from the Sapra prison", "notes": "He tracked Arjun to Calimport for the bounty. Korvara killed him and CFAR's EMTs brought him right back. He swore revenge and said someone sold him Arjun's location cheap.", "group": "rival"}, {"name": "Ressik", "role": "Half-orc field commander of the Returned", "notes": "She tried to steal the Mythallar in Faeressar and was nearly killed by the crew's decoy bomb. Magnus spoke through her and took her body with him into the Fugue Plane.", "group": "rival"}, {"name": "Brother Valdris", "role": "Monk of the Grey Hands", "notes": "He attacked the crew mid-voyage to take the cargo and almost beat all of them. Charles trapped him and took him away.", "group": "rival"}, {"name": "The Broker", "role": "Unseen power broker", "notes": "A quiet man uptown with his hands in every pie, never seen in person, rumored to have Zhentarim ties. He paid Freya to join the crew and report on them.", "group": "other"}, {"name": "Dagoth the Patient", "role": "Elderly philanthropist, said to be a criminal mastermind", "notes": "The decoded cipher pointed at him, and the crew thought it looked like a plant. The Harpers arrested him anyway. He said they were falling for a plot, and Korvara believes him.", "group": "neutral"}, {"name": "Sed Halloran", "role": "Small-time crook who ran the Shackles Ward toll-gate", "notes": "He answered to a quiet man uptown. He fell off his wall into the sewer during the toll fight and escaped.", "group": "rival"}, {"name": "Mr. Quell", "role": "Dapper fixer with business from the McToad brothers", "notes": "He pulled Quix away and gave him the job to steal Restoration 3.0 scrolls from CFAR, one of them to bring back Olivea.", "group": "other"}, {"name": "Roan", "role": "Master burglar, one of Arjun's old cellmates", "notes": "He answered Arjun's sending-stone call for help with the heist and said he would reach Calimport within three days.", "group": "ally"}, {"name": "Tariq", "role": "Orphan boy rescued in Session 2", "notes": "The only survivor of a pirate attack. He now lives aboard the ship, and Quix gave him a shooting lesson.", "group": "ally"}, {"name": "CM-7", "role": "Small bronze construct, Arjun's companion", "notes": "It was smashed fighting pirates in Session 2. Charles brought it back online, but it cannot speak until someone finds its missing language parts.", "group": "ally"}, {"name": "Maribel", "role": "Runs Anakis's orphanage in Baldur's Gate", "notes": "Her letter said CFAR paid the orphanage's bills for a year and fixed the roof, and that CFAR is now working all through Baldur's Gate.", "group": "ally"}, {"name": "Tasha", "role": "Ancient witch, also called Iggwilv and the Old Lady of the Bog", "notes": "She sold Korvara a lantern in Calimport and stole a village's children in the Feywild. The party made a deal with her: the children went free in exchange for carrying her token to the staff's destruction. She also made Snicker-Snack.", "group": "other"}, {"name": "The Red Queen", "role": "Ruler of the Feywild realm the party is in", "notes": "She went mad when the Feywild died and paints the dead trees green and the dead roses red. Her court beheads uninvited guests, and Freya's mother is in her prison.", "group": "other"}, {"name": "Shoon", "role": "The spirit in the Staff of Shoon", "notes": "An ancient, evil Calishite emperor and wizard who now wears the form of an elf woman that only Celeste can see. Tasha's old enemy. He wants the staff used, not destroyed.", "group": "rival"}], "factions": [{"name": "CFAR (Centre for Applied Research)", "notes": "Charles Xander's organization. It rebuilt Calimport and runs the death-detection network and the EMTs who resurrect the dead. Its tower is the Blue Needle. Its secret research base is on another world, out of the gods' reach. It holds Netherese Mythallars and a mind flayer ship it uses for healing. The crew works for it unofficially, paid but not signed."}, {"name": "Church of Kelemvor", "notes": "Followers of the god of the dead. They say resurrection breaks the natural cycle of souls. They oppose CFAR through politics and protest. They also run the Lastlight hospice in the Shackles Ward. Their High Doomguide is Seraphina al-Akhtar."}, {"name": "The Grey Hands", "notes": "The militant wing of the Church of Kelemvor. They attacked the crew mid-voyage with a device that overloads airship crystals."}, {"name": "The Zhentarim", "notes": "A network of thieves and assassins with an old grudge against Charles Xander. Resurrection makes assassination pointless, so they are losing ground. Anakis carries a Zhentarim second-in-command badge, and it has already bluffed three of them off a roof."}, {"name": "The Returned", "notes": "People CFAR brought back from the dead, and their allies inside CFAR, who want resurrection everywhere and faster than Charles allows. Their commander Ressik tried to steal the Mythallar in Faeressar."}, {"name": "The Harpers", "notes": "A secret network that watches concentrated power. Lira runs a safe house under a Calimport bookshop with a war-room map that has Charles Xander at its center."}, {"name": "The Seelie and Unseelie Courts", "notes": "The two great courts of the Feywild. Tasha wants back into the Unseelie Court. Grex and the halfling work for the Seelie Court."}], "places": [{"name": "Calimport", "notes": "The crew's home port, the largest city in Calimshan, split into walled wards. The rich travel on byways along the wall-tops."}, {"name": "The Blue Needle", "notes": "CFAR's tower in Calimport, where Emi works and the crew met Charles."}, {"name": "K-Mart (Kobold Mart)", "notes": "Meepo's run-down shop, the source of the crew's experimental airship crystals."}, {"name": "The Shackles Ward", "notes": "Calimport's poorest ward, where CFAR's EMTs arrive slowest."}, {"name": "The Lastlight", "notes": "Father Tomás's Kelemvorite hospice in the Shackles Ward."}, {"name": "The Muzad", "notes": "The buried city under Calimport. Never go down without a guide you trust. It has a haunted ghost village and the cistern where the children were held."}, {"name": "The Shoon wall", "notes": "A wall under the Muzad covered in Shoon Dynasty glyphs. It drains the life of anyone who licks it. The Church is sealing it."}, {"name": "Lira's bookshop", "notes": "A Harper safe house with a war-room behind a sliding bookcase."}, {"name": "Faeressar", "notes": "A sandstone port city on the southern coast below the Marching Mountains, where the crew delivered the Mythallar. No resurrection there."}, {"name": "The sunken Netherese city", "notes": "A glowing green ruin under the sea on the route to Faeressar. The crew marked it on their maps."}, {"name": "CFAR's nameless world", "notes": "A secret research base on another planet, with a warehouse of Mythallars. Charles says not to name it, because names make it easier to scry."}, {"name": "Sapra", "notes": "The mine-prison Arjun broke out of."}, {"name": "The Feywild", "notes": "A dying fey realm where the trees are dead, sleep rewinds the day, and names have power. The only known way out is a portal the Staff of Shoon opens."}, {"name": "The village behind the salt", "notes": "A human village that a hag (Tasha) pulled into the Feywild. It will go home when the Staff of Shoon is destroyed."}, {"name": "The Red Queen's fortress", "notes": "A fortress carved into a mountain in a land of endless winter, where snow falls upward and trees watch you pass."}], "sessions": [{"n": 1, "title": "A Job With a Reference", "summary": "The crew's old mechanic and navigator sabotaged the airship crystals and sold the crew out to pirates. The crew blew up the pirate ship with one well-placed shot and limped into Calimport. A well-paid job on a tavern board needed a reference. On the way to ask about it, they scared off a gang that was beating a kobold named Meepo. Meepo gave them experimental K-Mart crystals and a letter of recommendation that read \"THESE DOODS COOL.\" It worked, and a quiet fixer handed them a box to smuggle out of the city."}, {"n": 2, "title": "The Abandoned Ship", "summary": "On the way to Faeressar, the crew found a drifting ship and a dehydrated boy, Tariq, the only survivor of a pirate attack. The pirates ambushed them. Korvara told CM-7 the pirates threatened the cargo, and the little construct zapped their leader before it was smashed against a wall. The crew won narrowly and found a Zhentarim second-in-command badge in a lockbox. Later they passed a glowing green sunken Netherese city that drew CM-7 toward it, and marked it on their maps."}, {"n": 3, "title": "Grey Hands", "summary": "Arjun dreamed of a vast wall of bodies where every face had the wizard's changing eyes. The crew picked up Dendrobo, a grung cleric of Umberlee who had fallen off another ship. Then the Grey Hands, a militant wing of the Church of Kelemvor, overloaded the crystals with a device. The crew crashed the ship into the sea and hid the chest underwater. Brother Valdris, a monk who caught bullets and threw them back, dropped nearly the whole party until Charles Xander folded space, trapped him in a Wall of Force, and sealed his ship in a metal cube. The crew reached level 2."}, {"n": 4, "title": "Faeressar: The Mythallar Revealed", "summary": "In Faeressar, CFAR handler Emi Sandoval set the handoff for half past midnight at Slip 14. Anakis and Quix repaired a crack in the chest and saw the cargo: a Mythallar, a small sphere with a tiny sun inside, based on ancient Netherese work. Dendrobo quit the job, and Freya joined in his place. Korvara, disguised as a spider, overheard Ressik of the Returned threaten Emi into letting her steal the chest. Korvara then won Emi over, and the crew built a decoy chest that explodes when opened."}, {"n": 5, "title": "Bait", "summary": "Anakis bluffed three Zhentarim off a roof with the stolen badge. Ressik opened the decoy and the warehouse vanished in a sphere of ash. Then a voice spoke through the dying Ressik, and Magnus, the wizard Arjun hunts, stepped out of a tear in the air. He stood back up after Arjun shot him in the head. Charles arrived, and the two archmages fought until Magnus retreated into the Fugue Plane, taking Ressik with him. Charles took the crew to a secret lab on another world and admitted they were bait: Magnus is Subject Zero of his resurrection experiments. The crew was paid, Anakis's orphanage was funded for a year, and everyone reached level 3."}, {"n": 6, "title": "The Smallest Job", "summary": "Back in Calimport, Meepo asked the crew to find little Pook, a missing kobold child. At the Lastlight hospice they met Father Tomás and Corvo, a bard the Church had hired to play for the dying. Tomás pointed them at an illegal toll-gate run by Sed Halloran. When Halloran turned out to answer to a quiet man uptown, Quix recognized the name of the Broker, and Freya admitted the Broker paid her to join the crew. The crew took the toll-gate by surprise, but Sed fell into the sewer and escaped."}, {"n": 7, "title": "The Cistern", "summary": "Arjun rejoined the crew, and Quix left after a dapper stranger pressed something into his hand. A captured thug led the crew into the Muzad, the buried city under Calimport. In a haunted village they met Counselor Beans, who was possessed by a ghost until they knocked it out of him. At the cistern, Arjun pulled Pook to safety, and the crew fought across the sluice channel. Freya shot the fleeing leader, and the children were saved."}, {"n": 8, "title": "The Spicy Wall and the Sanctioned Heist", "summary": "Under the cistern the crew found a wall covered in Shoon Dynasty glyphs. Beans licked it and aged ten years, until Father Tomás lifted the curse. Quix pitched Mr. Quell's job to steal resurrection scrolls from Charles to bring back his friend Olivea. Freya saw her mother, Sylwen, alive in a prison cell, and pulled the sword Snicker-Snack out of the vision. Korvara visited Lira's Harper war-room, and the cipher book the crew had found pointed suspiciously neatly at Dagoth the Patient. Instead of stealing, Arjun went to Charles, who authorized a staged heist to catch a leak inside CFAR and gave the crew magic gear from his armory."}, {"n": 9, "title": "Sold Cheap", "summary": "Merrick, a guard from Arjun's old prison, ambushed the crew. Korvara killed him with a huge Guiding Bolt, and CFAR's EMTs brought him back on the spot. Quix freed Dendrobo from a fish stall. On the sending stones, Roan the master burglar agreed to help with the heist, but Magnus answered on Oren's stone and invited Arjun to come find him. Charles showed Arjun a damaged Karsus scroll that could open the way into the Fugue Plane, and returned CM-7 working but mute. Korvara watched the Harpers arrest Dagoth, and she believes him when he says it is a frame."}, {"n": 13, "title": "Which Bones?", "summary": "In the Feywild, a storytelling tree nearly turned three of the party into trees. Then it told Freya that the Red Queen took an elf woman who carried her sword. Beans licked the Staff of Shoon and aged forty years, and Celeste began to see a hostile elf woman who lives in the staff. Beans ended a fight with bone-hungry frog-folk by asking if they had bones of their own. The party rallied a stolen human village against the hag who takes its children, fought off face-wearing Jubjub birds in a magic fog, and reached the hag's glade."}, {"n": 14, "title": "Tea With Tasha", "summary": "In a flashback, Anakis signed out a Mythallar from CFAR's off-world site, and it must go back within 72 hours. The party crossed a field of glyph traps, and a sprite named Grex told them the hag was Iggwilv, better known as Tasha. Tasha served them tea, and Anakis slipped away to find the stolen children in tanks. The spirit in the staff turned out to be Shoon, Tasha's old enemy. The party made a deal: the children go free, and the party carries Tasha's red-rose token to the place where the staff will be destroyed. Tasha told Freya her mother's story, and the party followed the backwards-speaking White Knight into the Red Queen's fortress."}], "gap_note": "Sessions 10, 11 and 12 were played but do not have recaps yet.", "open_threads": ["Return the Mythallar Anakis signed out from CFAR within 72 hours (as of Session 14).", "Free Freya's mother, Sylwen, from the Red Queen's prison. She probably knows where the headwaters are.", "Destroy the Staff of Shoon at the headwaters where it was made. Only the Red Queen knows where they are.", "Defeat the corrupted creature that guards the headwaters. Only Snicker-Snack can strike the finishing blow.", "Decide what to do with Tasha's red-rose token. It gives safe passage through the Red Queen's court, but it also sends the staff's power to Tasha.", "Get the stolen village home. It returns to the Material Plane only after Tasha confirms the staff is gone.", "Find a way out of the Feywild. The only known way is a portal the Staff of Shoon opens when it chooses.", "Lift Beans's curse. It ends when the staff is destroyed or the curse is removed.", "As of Session 9: run Charles's staged heist on the Council of Mages scroll shipment, and find out who bought CFAR's leaked plans.", "As of Session 9: rescue Oren from Magnus in the Fugue Plane. That needs a complete Karsus scroll.", "As of Session 9: find the parts CM-7 needs to speak again.", "As of Session 9: find out who framed Dagoth and who sold Arjun's location to Merrick.", "Merrick and Sed Halloran are both loose and want revenge."], "lore_glossary": [{"term": "Mythallar", "definition": "A Netherese device that powers great magic, once used to keep whole cities in the sky. CFAR makes small ones."}, {"term": "Netheril", "definition": "An ancient empire of wizards with flying cities. It fell about 3,000 years ago when its magic failed."}, {"term": "EMTs", "definition": "CFAR's Emergency Miracle Technicians, who come within minutes of a death in Calimport and resurrect the person. They often step out of the trees at intersections."}, {"term": "The death-detection network", "definition": "CFAR's web of magical wire through Calimport that notices when someone dies."}, {"term": "The Fugue Plane", "definition": "Where souls go after death to wait for their god."}, {"term": "The Wall of the Faithless", "definition": "A wall in the Fugue Plane made of the souls of the faithless, people who served no god."}, {"term": "Kelemvor", "definition": "The god of the dead, who judges souls. His church opposes CFAR."}, {"term": "Umberlee", "definition": "The goddess of the sea and storms, called the Sea Bitch. Dendrobo serves her."}, {"term": "Phlogiston", "definition": "The medium between worlds. Charles says the gods cannot reach through it, which is why his base is off-world."}, {"term": "Simulacrum", "definition": "A magical copy of a person. Charles often sends one in his place."}, {"term": "Restoration 3.0", "definition": "CFAR's newest resurrection scrolls, kept at the top of the Needle."}, {"term": "Karsus scroll", "definition": "An ancient Netherese scroll for breaking into the afterlife. Charles's copy is burned at the bottom. A complete copy is worth about 50,000 gold."}, {"term": "Shoon Dynasty", "definition": "An ancient Calishite empire of powerful, cruel wizard-emperors."}, {"term": "Staff of Shoon", "definition": "A staff that holds the spirit of the emperor Shoon. It ages anyone foolish enough to lick it, it vaporized a Jubjub bird in one hit, and it can open a way out of the Feywild."}, {"term": "Snicker-Snack", "definition": "Freya's sentient vorpal sword. Tasha made it, and it belonged to Freya's mother. It hits fey creatures harder."}, {"term": "The Muzad", "definition": "The buried older city under Calimport, layer on layer of ruins with no good maps."}, {"term": "Byways", "definition": "Roads along the tops of Calimport's walls, where the wealthy travel above the crowded streets."}, {"term": "Sending stones", "definition": "Paired stones for short messages over distance. Arjun's old cellmates each carry one."}, {"term": "Jubjub birds", "definition": "Red Feywild birds that steal voices to lure travelers. They are weak to iron and guard a single egg."}, {"term": "Names in the Feywild", "definition": "The Feywild keeps a record of everyone's name, and a true name is the most valuable thing you can own there."}]}</script>
<script type="module">
import { mountGlobe } from "./globe.js";

const D = JSON.parse(document.getElementById("data").textContent);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
document.getElementById("tagline").textContent = D.tagline;

// Theme: MD3 dark scheme from one desert-gold source color (material-dynamic-colors).
const applyTheme = () => window.ui ? ui("theme", "#c9a227") : setTimeout(applyTheme, 50);
applyTheme();

// Globe
const hero = document.getElementById("hero");
const bar = document.getElementById("loadbar"), prog = document.getElementById("progress");
const globe = mountGlobe(hero, {
  onProgress: (f) => { prog.value = f; },
  onReady: () => { bar.hidden = true; window.READY = 1; },
  onError: () => fallback(),
});
function fallback() {
  bar.hidden = true;
  hero.querySelector("canvas")?.remove();
  hero.querySelectorAll(".pin").forEach((p) => p.remove());
  const img = document.createElement("img");
  img.className = "flat"; img.src = "toril-4096.jpg"; img.alt = "Flat world map of Toril";
  hero.prepend(img);
  document.getElementById("fly").hidden = document.getElementById("reset").hidden = true;
  window.READY = 1;
}
if (!globe) fallback();
document.getElementById("fly").onclick = () => globe?.flyTo("calimport");
document.getElementById("reset").onclick = () => globe?.reset();

// Reference tabs
const statusChip = (s) => s && s !== "active" ? `<span class="chip small">${esc(s)}</span>` : "";
const sections = [
  ["overview", "auto_stories", "Overview", () => `
    ${D.overview.map((p) => `<p>${esc(p)}</p>`).join("")}
    <h5 class="group-title">Open threads</h5>
    <ul class="list border">${D.open_threads.map((t) => `<li><i>flag</i><div class="max">${esc(t)}</div></li>`).join("")}</ul>`],
  ["party", "groups", "Party", () => `
    <div class="grid-cards">${D.party.map((p) => `
      <article class="round"><h6 class="no-margin">${esc(p.name)} ${statusChip(p.status)}</h6><p class="muted">${esc(p.summary)}</p></article>`).join("")}</div>`],
  ["npcs", "person_search", "NPCs", () => {
    const order = ["patron", "ally", "neutral", "rival", "other"];
    return order.filter((g) => D.npcs.some((n) => n.group === g)).map((g) => `
      <h5 class="group-title">${{patron: "Patrons", ally: "Allies", neutral: "Neutral", rival: "Rivals", other: "Others"}[g]}</h5>
      <div class="grid-cards">${D.npcs.filter((n) => n.group === g).map((n) => `
        <article class="round"><h6 class="no-margin">${esc(n.name)}</h6><div class="small-text primary-text">${esc(n.role)}</div><p class="muted">${esc(n.notes)}</p></article>`).join("")}</div>`).join("");
  }],
  ["world", "castle", "Factions & Places", () => `
    <h5 class="group-title">Factions</h5>
    <div class="grid-cards">${D.factions.map((f) => `<article class="round"><h6 class="no-margin">${esc(f.name)}</h6><p class="muted">${esc(f.notes)}</p></article>`).join("")}</div>
    <h5 class="group-title">Places</h5>
    <ul class="list border">${D.places.map((p) => `<li><i>location_on</i><div class="max"><h6 class="small no-margin">${esc(p.name)}</h6><div class="muted">${esc(p.notes)}</div></div></li>`).join("")}</ul>`],
  ["sessions", "history_edu", "Sessions", () => {
    const items = [...D.sessions].sort((a, b) => b.n - a.n).map((s) => `
      <article class="round"><details class="session"${s === D.sessions[D.sessions.length - 1] ? " open" : ""}>
        <summary><span class="chip circle">${s.n}</span><h6 class="max no-margin">${esc(s.title)}</h6><i class="chev">expand_more</i></summary>
        <p>${esc(s.summary)}</p></details></article>`);
    // The gap note sits where sessions 10 to 12 would be in the newest-first order.
    const at = items.findIndex((_, i) => [...D.sessions].sort((a, b) => b.n - a.n)[i].n < 10);
    items.splice(at < 0 ? items.length : at, 0, `<article class="round border"><div class="row"><i>hourglass_empty</i><div class="max muted">${esc(D.gap_note)}</div></div></article>`);
    return items.join("");
  }],
  ["glossary", "menu_book", "Glossary", () => `
    <dl class="gloss">${[...D.lore_glossary].sort((a, b) => a.term.localeCompare(b.term)).map((g) => `<dt>${esc(g.term)}</dt><dd>${esc(g.definition)}</dd>`).join("")}</dl>`],
];
const tabs = document.getElementById("tabs"), pages = document.getElementById("pages");
tabs.innerHTML = sections.map(([id, icon, label], i) => `<a role="tab" href="#${id}" data-id="${id}" class="${i ? "" : "active"}" aria-selected="${!i}"><i>${icon}</i><span>${label}</span></a>`).join("");
pages.innerHTML = sections.map(([id, , , render], i) => `<div class="page ${i ? "" : "active"}" id="page-${id}" role="tabpanel">${render()}</div>`).join("");
function show(id) {
  if (!sections.some(([s]) => s === id)) id = "overview";
  tabs.querySelectorAll("a").forEach((a) => { const on = a.dataset.id === id; a.classList.toggle("active", on); a.setAttribute("aria-selected", on); });
  pages.querySelectorAll(".page").forEach((p) => p.classList.toggle("active", p.id === "page-" + id));
}
tabs.addEventListener("click", (e) => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault(); history.replaceState(null, "", "#" + a.dataset.id); show(a.dataset.id);
});
show(location.hash.slice(1));
</script>
</body>
</html>
