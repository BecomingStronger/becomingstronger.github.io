 the north side.","source":"OSM USFS trailhead node"},"backbone_th":{"name":"Backbone Road turnoff","route_only":true,"lat":38.8098507,"lon":-92.1566659,"source":"OSM trailhead node"},"ridge":{"name":"Devil's Backbone","label":"Devil's Backbone","side":"r","lat":38.8044752,"lon":-92.1516701,"text":"A narrow ridge cut by erosion on both sides. The last half mile is on Backbone Road, past the point where the trail turns away.","source":"USGS GNIS 749635"}},"milestones":["smith_th","bridge","ridge","overlook","boydsville"],"plans":[{"id":"1-night","tab":"1 night","gpx_name":"Cedar Creek Smith Creek and Devil's Backbone (1 night)","eyebrow":"1 night \u00b7 4 hikers","title":"Smith Creek and Devil's Backbone","rec":false,"milestones":["smith_th","bridge","ridge","overlook","boydsville"],"side_trips":["ridge"],"notes":{"ridge":"Side trip on the first afternoon, out and back from camp with day packs."},"days":[{"name":"Day 1: Smith Creek Trailhead to camp","via":["smith_th","bridge","camp"]},{"name":"Day 1 afternoon: Devil's Backbone side trip","via":["camp","bridge","backbone_th","ridge","backbone_th","bridge","camp"],"side":true},{"name":"Day 2: Smith Creek Loop back to the trailhead","via":["camp","overlook","south_jct","boydsville","smith_th"]}]}],"why":[{"icon":"landscape","title":"The best of Cedar Creek, without the road miles.","text":"This trip keeps the three highlights of the trail system: the Smith Creek bluffs, Rutherford Bridge and Devil's Backbone. It leaves out the Southern Loop, which the Forest Service and a trip report describe as mostly gravel road and cattle pasture."},{"icon":"water_drop","title":"Camp beside Cedar Creek.","text":"Cedar Creek is the largest stream on the trail and the one most likely to run in a dry fall. On Oct 4, 2026 a hiker found every Moon Loop crossing dry. The bridge stands on private land, so camp on the National Forest land that starts 0.15 mi east of it, and walk back down to the creek for water."},{"icon":"hiking","title":" const C = DATA.config;
const WP = C.waypoints;
const PLANS = C.plans;
const DAYCOL = ["linear-gradient(90deg,#d7f14a,#9fc9ff)", "linear-gradient(90deg,#b9e9a0,#7fa8ff)", "linear-gradient(90deg,#9ad7c4,#4a72ff)", "#012FFF"];

const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);

/* ---------- static text ---------- */
$("#brandt").textContent = C.title; $("#brands").textContent = C.subtitle;
const LEG = [
  ['<span class="sw" style="background:#3f6b33"></span>', "National Forest, camping allowed"],

];
if (Object.values(WP).some((w) => w.tap)) LEG.push(['<span class="sw" style="width:12px;height:12px;margin:0 3px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)"></span>', "Tap water"]);

map.attributionControl.setPrefix(false);
L.tileLayer("https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}", { maxZoom: 17, maxNativeZoom: 16, attribution: "Imagery: USGS National Map", className: "imagery" }).addTo(map);
L.geoJSON(DATA.private, { interactive: false, style: { stroke: false, fillColor: "#dcdcd6", fillOpacity: 0.2 } }).addTo(map);
L.geoJSON(DATA.fs, { interactive: false, style: { color: "#ecf8be", weight: 1.2, opacity: 0.85, fill: false } }).addTo(map);
if (DATA.creeks) L.geoJSON(DATA.creeks, { interactive: false, style: { color: "#8fc3ff", weight: 1.4, opacity: 0.75 } }).addTo(map);
if (DATA.main) {
  L.geoJSON(DATA.main, { interactive: false, style: { color: "#ffffff", weight: 5, opacity: 0.35 } }).addTo(map);
  L.geoJSON(DATA.main, { interactive: false, style: { color: "#2f7dff", weight: 2.6, opacity: 1 } }).addTo(map);
  const lines = DATA.main.type === "MultiLineString" ? DATA.main.coordinates : [DATA.main.coordinates];
  const lb = C.water.label_box || C.bbox;
  const pts = lines.flat().filter((c) => c[1] > lb[0] && c[1] < lb[2] && c[0] > lb[1] && c[0] < lb[3]).sort((p, q) => q[1] - p[1]);
  (C.water.label_at || [0.12, 0.42, 0.72]).forEach((f) => {
    const c = pts[Math.floor(pts.length * f)];
    if (c) L.marker([c[1], c[0]], { interactive: false, keyboard: false, icon: L.divIcon({ className: "", iconSize: [0, 0], html: `<div class="creeklab">${esc(C.water.main)}</div>` }) }).addTo(map);
  });
}
map.attributionControl.addAttribution("Water: USGS NHD · Land: USFS · Trails © <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a>");

const MAIN_STYLE = { color: "#E1FF4F", weight: 5, opacity: 1, lineJoin: "round", dashArray: null };
const SIDE_STYLE = { color: "#E1FF4F", weight: 6, opacity: 1, lineJoin: "round", lineCap: "round", dashArray: "0.5 11" };
const layers = {};
PLANS.forEach((p) => {
  const days = DATA.plans[p.id].days;
  layers[p.id] = {
    other: L.layerGroup(days.map((d) => L.polyline(d.line, { color: "#fff", weight: 3, opacity: 0.9, interactive: false }))),
    halo: L.layerGroup(days.map((d) => L.polyline(d.line, { color: "#1d2a12", weight: 10, opacity: 0.5, interactive: false }))),
    sel: days.map((d) => L.polyline(d.line, d.side || d.optional ? SIDE_STYLE : MAIN_STYLE)),
  };
});
const ORDER = C.milestones;   // global numbering
const numOf = (id) => ORDER.indexOf(id) + 1;
const markers = {};
ORDER.forEach((id) => {
  const w = WP[id];
  const html = `<div class="mk"><div class="halo"></div><div class="dot${w.tap ? " tapdot" : ""}"${w.tap ? ' title="Tap water"' : ""}></div><div class="num">${numOf(id)}</div><div class="lab ${w.side || "r"}">${esc(w.label || w.name)}<span class="sidei" hidden>Side trip</span></div></div>`;
  const mk = L.marker([w.lat, w.lon], { icon: L.divIcon({ className: "", html, iconSize: [0, 0] }), keyboard: false, title: w.name });
  mk.on("click", () => flyTo(w));
  markers[id] = mk;
});
const camps = Object.values(WP).filter((w) => w.camp).map((w) => L.marker([w.lat, w.lon], { icon: L.divIcon({ className: "", html: `<div class="campmk" title="${esc(w.name)}"><span class="ms">camping</span></div>`, iconSize: [0, 0] }), keyboard: false, title: w.name }).addTo(map));
const cursor = L.marker([0, 0], { icon: L.divIcon({ className: "", html: '<div class="cursor"></div>', iconSize: [0, 0] }), interactive: false, keyboard: false });

let cur = null;
function selectTrip(i, fit = true) {
  const p = PLANS[i]; cur = p;
  Object.entries(layers).forEach(([k, l]) => { map.removeLayer(l.other); map.removeLayer(l.halo); l.sel.forEach((s) => map.removeLayer(s)); if (k !== p.id) l.other.addTo(map); });
  const L1 = layers[p.id]; L1.halo.addTo(map); L1.sel.forEach((s, j) => { s.addTo(map); s.off(); s.on("mouseover", () => hotDay(j)); s.on("mouseout", () => hotDay(-1)); s.on("click", () => fitDay(j)); });
  document.querySelectorAll(".tab").forEach((b, j) => b.setAttribute("aria-selected", j === i ? "true" : "false"));
  const days = DATA.plans[p.id].days, main = counted(days);
  const miles = sum(main, (d) => d.miles), gain = sum(main, (d) => d.gain);
  const taps = (p.milestones || []).filter((id) => WP[id].tap).length;
  $("#eyebrow").textContent = p.eyebrow; $("#title").textContent = p.title; $("#miles").textContent = miles.toFixed(1);
  $("#chips").innerHTML = (p.rec ? '<span class="chip rec">Recommended</span>' : "") +
    `<span class="chip"><i style="background:#f2c500"></i>${esc(p.difficulty || C.difficulty)}</span>` +
    `<span class="chip"><i style="background:#b9d400"></i>${gain.toLocaleString()} ft gain</span>` +
    `<span class="chip"><i style="background:var(--blue)"></i>${taps ? `Tap water at ${taps} stop${taps > 1 ? "s" : ""}` : "No tap water: filter or carry"}</span>`;
  const nDays = new Set(days.map((d) => d.name.split(":")[0].replace(/ (evening|morning|afternoon)$/, ""))).size;
  $("#dayshd").textContent = `Backpacking, ${nDays} day${nDays > 1 ? "s" : ""}`;
  $("#days").innerHTML = days.map((d, j) => {
    const [day, what] = d.name.split(": ");
    const tag = d.optional ? "Optional side trip" : d.side ? "Side trip · day packs" : "";
    return `<button class="row${d.side || d.optional ? " side" : ""}" data-j="${j}"><span>${esc(day)} · ${esc((what || "").replace(" side trip", ""))}${tag ? `<i class="stag">${tag}</i>` : ""}</span><b>${d.miles.toFixed(1)} mi</b><small>${d.side || d.optional ? "Out and back from camp · " : ""}${d.gain.toLocaleString()} ft gain · ${Math.round(d.min)} to ${Math.round(d.max)} ft</small></button>`;
  }).join("");
  document.querySelectorAll("#days .row").forEach((r) => {
    const j = +r.dataset.j;
    r.addEventListener("mouseenter", () => hotDay(j)); r.addEventListener("mouseleave", () => hotDay(-1));
    r.addEventListener("focus", () => hotDay(j)); r.addEventListener("blur", () => hotDay(-1));
    r.addEventListener("click", () => fitDay(j));
  });
  const link = DATA.links[p.id]; $("#atl").hidden = !link; if (link) $("#atl").href = link;
  $("#gpx").href = `${p.id}.gpx`;
  const on = new Set(p.milestones || []), notes = p.notes || {}, side = new Set(p.side_trips || []);
  ORDER.forEach((id) => {
    const mk = markers[id];
    if (on.has(id)) { mk.addTo(map); const pill = mk.getElement().querySelector(".sidei"); if (pill) pill.hidden = !side.has(id); }
    else map.removeLayer(mk);
  });
  const marks = DATA.marks[p.id] || {};
  $("#mlist").innerHTML = ORDER.filter((id) => on.has(id)).map((id) => {
    const w = WP[id], m = marks[id], dname = m ? days[m.day].name.split(":")[0] : "";
    const at = side.has(id) ? "" : m ? (m.mile < 0.05 ? (m.day === 0 ? "Start" : dname) : `${dname} · mi ${m.mile}`) : "";
    return `<button class="mrow${side.has(id) ? " side" : ""}" data-id="${id}"><span class="n">${numOf(id)}</span><span><b>${esc(w.name)}</b>${side.has(id) ? '<i class="stag dark">Side trip</i>' : ""}<p>${esc((notes[id] ? notes[id] + " " : "") + (w.text || ""))}</p></span><span class="mi">${esc(at)}</span></button>`;
  }).join("");
  document.querySelectorAll(".mrow").forEach((b) => b.addEventListener("click", () => { flyTo(WP[b.dataset.id]); if (innerWidth < 860) scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); }));
  const why = (C.why || []).filter((r) => !r.plans || r.plans.includes(p.id));
  $("#why").hidden = !why.length;
  $("#why").innerHTML = "<h2>Why this route</h2>" + why.map((r) => `<div class="wi"><span class="ms">${r.icon}</span><div><b>${esc(r.title)}</b>${r.tag && PLANS.length > 1 ? `<i class="wtag">${esc(r.tag)}</i>` : ""}<p>${esc(r.text)}</p></div></div>`).join("");
  drawProfile(main);
  if (fit) fitTrip();
  if (PLANS.length > 1) history.replaceState(null, "", "#" + p.id);
}
function fitTrip() { map.flyToBounds(L.featureGroup(layers[cur.id].sel).getBounds(), { ...padFor(), duration: reduce ? 0 : 0.8, animate: !reduce }); }
function fitDay(j) { map.flyToBounds(layers[cur.id].sel[j].getBounds(), { ...padFor(), duration: reduce ? 0 : 0.8, animate: !reduce }); }
function padFor() { const top = PLANS.length > 1 ? 150 : 100; return innerWidth < 860 ? { paddingTopLeft: [36, top], paddingBottomRight: [36, 90] } : { paddingTopLeft: [80, 110], paddingBottomRight: [80, 90] }; }
function hotDay(j) {
  const days = DATA.plans[cur.id].days;
  layers[cur.id].sel.forEach((s, k) => s.setStyle({ color: j < 0 || k === j ? "#E1FF4F" : "#a7b56a", weight: (days[k].side || days[k].optional ? 6 : 5) + (k === j ? 2 : 0) }));
  document.querySelectorAll("#days .row").forEach((r, k) => r.classList.toggle("hot", k === j));
}
function flyTo(w) { map.flyTo([w.lat, w.lon], 15, { duration: reduce ? 0 : 0.8, animate: !reduce }); }

/* ---------- elevation ---------- */
let prof = null;
function drawProfile(days) {
  const svg = $("#profsvg"), Wd = 1000, H = 150, B = 18;
  const pts = []; const bounds = []; let off = 0;
  days.forEach((d, j) => {
    const pr = d.profile;
    pr.forEach(([m, e], i) => { const win = pr.slice(Math.max(0, i - 2), i + 3); pts.push([off + m, win.reduce((a, x) => a + x[1], 0) / win.length, j]); });
    off += d.miles; bounds.push(off);
  });
  const lo = Math.min(...pts.map((q) => q[1])) - 30, hi = Math.max(...pts.map((q) => q[1])) + 15;
  const X = (m) => (m / off) * Wd, Y = (e) => (H - B) - ((e - lo) / (hi - lo)) * (H - B);
  const line = "M" + pts.map((q) => X(q[0]).toFixed(1) + "," + Y(q[1]).toFixed(1)).join(" L");
  svg.setAttribute("viewBox", `0 0 ${Wd} ${H}`);
  svg.innerHTML = `<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d5a2e"/><stop offset="1" stop-color="#3d5a2e" stop-opacity=".04"/></linearGradient></defs>` +
    `<path d="${line} L${Wd},${H - B} L0,${H - B} Z" fill="url(#pg)"/>` +
    bounds.slice(0, -1).map((b) => `<line x1="${X(b)}" x2="${X(b)}" y1="0" y2="${H - B}" stroke="rgba(0,0,0,.25)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`).join("") +
    `<path d="${line}" fill="none" stroke="#c6e600" stroke-width="2.2" vector-effect="non-scaling-stroke"/>` +
    `<line id="pcur" x1="0" x2="0" y1="0" y2="${H - B}" stroke="#012FFF" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity="0"/>`;
  $("#xax").innerHTML = [0, Math.round(off / 2), off].map((m) => `<span>${m === off ? off.toFixed(1) : m} mi</span>`).join("");
  $("#axhi").textContent = Math.round(hi - 15) + " ft"; $("#axlo").textContent = Math.round(lo + 30) + " ft";
  $("#daybar").innerHTML = days.map((d, j) => {
    const fr = d.miles / off, lab = fr >= 0.14 ? `<span>${esc(d.name.split(":")[0].replace(/^Day (\d) (evening|morning)$/, "Day $1 $2"))}</span>` : "";
    const bg = d.side ? `repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 4px, transparent 4px 9px), ${DAYCOL[j % 4]}` : DAYCOL[j % 4];
    return `<div style="flex:${fr.toFixed(3)};background:${bg};color:${DAYINK[j % 4]}" title="${d.side ? "Side trip" : ""}">${lab}<b>${d.miles.toFixed(1)}</b></div>`;
  }).join("");
  prof = { pts, off, X, days, bounds };
}
function lineAt(dayIdx, mile) {
  const ln = prof.days[dayIdx].line; let acc = 0;
  const hav = (a, b) => { const R = 3958.8, r = Math.PI / 180; const d1 = (b[0] - a[0]) * r, d2 = (b[1] - a[1]) * r; const x = Math.sin(d1 / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(d2 / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
  for (let i = 1; i < ln.length; i++) { const s = hav(ln[i - 1], ln[i]); if (acc + s >= mile) { const f = s ? (mile - acc) / s : 0; return [ln[i - 1][0] + (ln[i][0] - ln[i - 1][0]) * f, ln[i - 1][1] + (ln[i][1] - ln[i - 1][1]) * f]; } acc += s; }
  return ln[ln.length - 1];
}
function profMove(clientX) {
  const box = $("#prof").getBoundingClientRect(); const f = Math.min(1, Math.max(0, (clientX - box.left) / box.width));
  const m = f * prof.off; let best = prof.pts[0];
  for (const q of prof.pts) { if (Math.abs(q[0] - m) < Math.abs(best[0] - m)) best = q; }
  const j = best[2], start = j ? prof.bounds[j - 1] : 0;
  const pc = $("#pcur"); pc.setAttribute("x1", prof.X(best[0])); pc.setAttribute("x2", prof.X(best[0])); pc.setAttribute("opacity", "1");
  const tip = $("#tip"); tip.style.left = (f * 100) + "%"; tip.textContent = `${prof.days[j].name.split(":")[0]} · mi ${(best[0] - start).toFixed(1)} · ${Math.round(best[1])} ft`;
  $("#prof").classList.add("active"); cursor.setLatLng(lineAt(j, best[0] - start)).addTo(map);
  const all = DATA.plans[cur.id].days; hotDay(all.indexOf(prof.days[j]));
}
function profLeave() { $("#prof").classList.remove("active"); $("#pcur") && $("#pcur").setAttribute("opacity", "0"); map.removeLayer(cursor); hotDay(-1); }
const pe = $("#prof");
pe.addEventListener("pointermove", (e) => profMove(e.clientX));
pe.addEventListener("pointerdown", (e) => profMove(e.clientX));
pe.addEventListener("pointerleave", profLeave);

/* ---------- tabs and controls ---------- */
$("#tabs").hidden = PLANS.length < 2;
$("#tabs").innerHTML = PLANS.map((p, i) => `<button class="tab" role="tab" data-i="${i}">${esc(p.tab)} · ${Math.round(sum(counted(DATA.plans[p.id].days), (d) => d.miles))} mi</button>`).join("");
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => selectTrip(+b.dataset.i)));
$("#fit").addEventListener("click", fitTrip);
$("#zin").addEventListener("click", () => map.zoomIn());
$("#zout").addEventListener("click", () => map.zoomOut());
let me = null;
$("#locate").addEventListener("click", () => {
  if (!navigator.geolocation) return;
  $("#locate").classList.add("on");
  navigator.geolocation.getCurrentPosition((q) => {
    const ll = [q.coords.latitude, q.coords.longitude];
    if (me) me.setLatLng(ll); else me = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#012FFF", fillOpacity: 1 }).addTo(map);
    map.flyTo(ll, Math.max(map.getZoom(), 14), { animate: !reduce });
  }, () => $("#locate").classList.remove("on"), { enableHighAccuracy: true, timeout: 10000 });
});
const startIdx = Math.max(0, PLANS.findIndex((p) => "#" + p.id === location.hash), PLANS.findIndex((p) => p.rec && !location.hash));
map.fitBounds(L.featureGroup(layers[PLANS[startIdx].id].sel).getBounds(), padFor());
selectTrip(startIdx, false);
</script>
</body>
</html>
